<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="description" content="this Is our Book store" />
  <title>Document</title>

  <style>
    /* خلفية الصفحة كاملة */
    body {

      margin: 0;
      padding: 0;
      height: 100vh;
      background: url('img/Jerash6.jpeg') no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }

    /* المربع الرئيسي الشفاف */
    .login-box {
      background: rgba(255, 255, 255, 0, 0.15);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      width: 300px;
      text-align: center;
      color: #fff;

    }

    .login-box h2 {
      color: #333;
      margin-bottom: 20px;
    }

    /*حقول الإدخال*/
    .login-box input[ type="taxt"] .login-box input[ type="password"] {

      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.2);
      box-sizing: border-box;
      color: #333;
      outline: none;
    }

    .login-box input::placeholder {
      color: #666;
    }

    /* زر LOGIN */
    .login-box button {
      width: 100%;
      padding: 10px;
      background-color: #2b7a78;
      border: none;
      border-radius: 4px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;

    }
    .login-box button:hover{
      background-color: #205e5c;

    }

    /* الخيارات السفليّة (Remember me و Forgot Password) */

.options{
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  margin-top: 15px;
  color: #0d1213;
}

.options a{
  color: #0a0d0d;
  text-decoration: none;
}

.options a:hover{
  text-decoration: underline;
}
</style>
</head>

<body>
  <div class="login-box">
    <h2> welcome to Speak the dialects of Jordan </h2>

    <form>
      <input type="text" placeholder="Username" required>
      <input type="password" placeholder="password" required>
      <button type="submit"> LOGIN</button>
      <div class="options">
        <label>
          <input type="checkbox">Remember me
        </label>
        <a href="#">Forgot password ?</a>

      </div>
    </form>
  </div>

</body>

</html>
